<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquid Glass UI</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <section id="controls"></section>
    <div id="canvas-tools" hidden>
      <div class="canvas-tool-row" role="group" aria-label="Selected button tools" data-aria="canvasTools">
        <button id="canvas-copy" type="button" aria-label="Copy selected button for AI" data-aria="canvasCopy" data-title="canvasCopy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h1"/></svg>
          <span data-i18n="copyReplica">Copy for AI</span>
        </button>
        <button id="text-tool" type="button" aria-label="Edit button text" aria-controls="text-editor" aria-expanded="false" data-aria="editText" data-title="editText">T</button>
        <button id="canvas-delete" type="button" aria-label="Delete selected button" data-aria="deleteButton" data-title="deleteButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v6m4-6v6"/></svg>
        </button>
      </div>
      <div id="text-editor" hidden>
        <label for="button-text" data-i18n="buttonText">Button text</label>
        <input id="button-text" maxlength="100">
      </div>
    </div>
    <button id="canvas-resize" type="button" hidden aria-label="Resize selected button" data-aria="resizeButton" data-title="resizeButton"></button>
    <div class="language-tools" role="group" aria-label="Language" data-aria="language">
      <button type="button" data-language="zh" lang="zh-CN" aria-pressed="false">中文</button>
      <button type="button" data-language="en" lang="en" aria-pressed="true">EN</button>
    </div>
  </main>
  <aside id="presets-panel" aria-labelledby="presets-title">
    <h1 id="presets-title" data-i18n="title">Liquid glass</h1>
    <p class="panel-intro" data-i18n="intro">Shape a button, tune its optics, and take it into your project.</p>
    <h2 id="wallpaper-title" class="material-title" data-i18n="wallpaper">Background</h2>
    <div class="wallpaper-options" role="group" aria-labelledby="wallpaper-title">
      <button type="button" data-wallpaper="daisy" aria-pressed="false"><img src="../assets/wallpapers/daisy.jpg" alt=""><span data-i18n="daisy">Daisy</span></button>
      <button type="button" data-wallpaper="prism" aria-pressed="false"><img src="../assets/wallpapers/prism.jpg" alt=""><span data-i18n="prismWallpaper">Crystal</span></button>
      <button type="button" data-wallpaper="lake" aria-pressed="false"><img src="../assets/wallpapers/lake.jpg" alt=""><span data-i18n="lake">Lake</span></button>
      <button type="button" data-wallpaper="grid" aria-pressed="false"><img src="../assets/glass-grid.svg" alt=""><span data-i18n="grid">Grid</span></button>
    </div>
    <h2 class="material-title" data-i18n="presets">Material preset</h2>
    <div id="preset-options" role="group" aria-label="Material preset" data-aria="presets"></div>
    <p id="preset-description" aria-live="polite"></p>
    <section class="button-inspector" aria-labelledby="button-title">
      <header>
        <h2 id="button-title" data-i18n="button">Button</h2>
        <button id="add-button" type="button" data-i18n="add">Add shape</button>
      </header>
      <p class="selection-hint" data-i18n="selectionHint">Click a glass shape on the canvas to edit it.</p>
      <label for="button-shape" data-i18n="shape">Shape</label>
      <select id="button-shape">
        <option value="circle" data-i18n="circle">Circle / ellipse</option>
        <option value="capsule" data-i18n="capsule">Capsule</option>
        <option value="rounded" data-i18n="rounded">Rounded rectangle</option>
        <option value="square" data-i18n="square">Square / rectangle</option>
      </select>
      <div class="size-fields">
        <div class="size-field">
          <label for="button-width" data-i18n="width">Width</label>
          <input id="width-range" type="range" min="44" max="400" step="1" aria-label="Width slider" data-aria="widthSlider">
          <input id="button-width" type="number" min="44" max="400" step="any">
          <span aria-hidden="true">px</span>
        </div>
        <div class="size-field">
          <label for="button-height" data-i18n="height">Height</label>
          <input id="height-range" type="range" min="44" max="400" step="1" aria-label="Height slider" data-aria="heightSlider">
          <input id="button-height" type="number" min="44" max="400" step="any">
          <span aria-hidden="true">px</span>
        </div>
      </div>
      <button id="copy-button" type="button" data-i18n="copyJS">Copy offline JS</button>
      <p id="editor-message" role="status"></p>
    </section>
  </aside>
  <dialog id="copy-dialog">
    <form method="dialog">
      <label for="copy-source" data-i18n="manualCopy">Copy this text</label>
      <textarea id="copy-source" readonly rows="10"></textarea>
      <button data-i18n="close">Close</button>
    </form>
  </dialog>
  <script type="module" src="./demo.js"></script>
</body>
</html>
