<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquid Glass UI</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <section id="controls" data-layout="controls"></section>
    <nav id="layouts" class="layouts" aria-label="Glass layouts">
      <button type="button" data-layout="scene" aria-pressed="true">Scene</button>
      <button type="button" data-layout="controls">Controls</button>
      <button type="button" data-layout="panel">Panel</button>
      <button type="button" data-layout="lens">Lens</button>
      <button type="button" data-layout="morph">Morph</button>
      <button type="button" data-layout="slider">Slider</button>
      <button type="button" data-layout="ios">iOS controls</button>
    </nav>
    <p id="status" role="status">Drag the glass. Buttons press, scale, and animate.</p>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
