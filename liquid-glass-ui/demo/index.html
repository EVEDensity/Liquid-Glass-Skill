<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquid Glass UI</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <section id="controls"></section>
    <p id="status" role="status">Drag the glass. Buttons press, scale, and animate.</p>
  </main>
  <aside id="presets-panel" aria-labelledby="presets-title">
    <h1 id="presets-title">Liquid glass presets</h1>
    <p class="preset-scope">Editing <strong>Scene</strong></p>
    <div id="preset-options" role="group" aria-label="Material preset"></div>
    <p id="preset-description" aria-live="polite"></p>
  </aside>
  <script type="module" src="./demo.js"></script>
</body>
</html>
